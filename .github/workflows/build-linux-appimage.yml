name: APPIMAGE LINUX PACKAGE

on:
  workflow_dispatch:

jobs:
  build-appimage:
    name: Build APPIMAGE LINUX PACKAGE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends build-essential libgtk-3-dev libxtst-dev libxss1 \
            libasound2t64 libnss3 libx11-xcb-dev libssl-dev curl pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Build AppImage package
        run: npm run build:linux -- --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Collect AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package-${{ github.run_id }}
          path: |
            release/*.AppImage
            release/install-fuse2.sh
